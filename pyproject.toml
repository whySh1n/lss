[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-screen-share"
version = "0.2.0"
description = "Private screen and voice calls, plus a Linux virtual camera"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "LinuxShare Contributors" },
]
keywords = ["screen", "share", "webcam", "v4l2loopback", "wayland", "x11", "pipewire"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = []

[project.optional-dependencies]
calls = ["aiohttp>=3.14.3,<4"]
gui = ["PyGObject>=3.42"]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "black>=23.0",
    "pytest-asyncio>=0.24",
    "pytest-aiohttp>=1.0",
]

[project.urls]
Homepage = "https://github.com/whySh1n/linux-screen-share"
Repository = "https://github.com/whySh1n/linux-screen-share"
Issues = "https://github.com/whySh1n/linux-screen-share/issues"

[project.scripts]
linuxshare-call = "linuxshare_calls.launcher:main"
linuxshare-call-server = "linuxshare_calls.server:main"
linuxshare-cli = "linuxshare_cli.main:main"
linuxshare-gui = "linuxshare_gui.main:main"

[tool.setuptools]
packages = ["linuxshare_cli", "linuxshare_gui", "linuxshare_calls", "linuxshare_calls.static"]

[tool.setuptools.package-data]
linuxshare_calls = ["static/*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
