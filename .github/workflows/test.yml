name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' build bandit
      - run: python -m pytest -q
      - run: flake8 -j 1 linuxshare_cli linuxshare_gui tests
      - run: bandit -r linuxshare_cli linuxshare_gui -ll
      - run: bash -n install.sh && ./install.sh --dry-run
      - run: python -m build
      - run: ./install.sh --prefix "$RUNNER_TEMP/linuxshare test"
      - run: '"$RUNNER_TEMP/linuxshare test/bin/linuxshare-cli" --version'
  portal-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi dbus
      - run: dbus-run-session -- /usr/bin/python3 tests/portal_integration.py
